    support_info: |-
      ●  围术期不同阶段均应进行容量管理且各有侧重：术前应尽量避免急性容量负荷，术中应依照血流动力学进行合理检测，保证有效的液体治疗，术后应尽量避免多脏器并发症
      ●  《2021 人血白蛋白在危重症患者应用专家共识》1：推荐人血白蛋白用于心脏外科围手术期休克患者的液体复苏治疗
      ●  人血白蛋白是用于心外围术期理想的扩容剂，早期联合白蛋白进行容量管理，可改善液体正平衡，降低AKI发生率和死亡风险，缩短住院时间，改善患者预后2,3
    comm_literature_titles: |-
      1. Yu YT,et al. Chin Med J (Engl). 2021;134(14):1639-1654.
      2. J Cardiothorac Vasc Anesth 2004; 18 (4): 429-437.
      3. Kingeter AJet al. Can J Anaesth. 2018;65 (11):1218-1227
    comm_literature_summaries: |-
      1. 2021人血白蛋白在危重症患者应用专家共识
      ●  人血白蛋白溶液作为脓毒症患者复苏液体是安全的（Grade 2+）
      ●  在脓毒症休克患者液体复苏中使用人血白蛋白可能改善病死率（Grade 2+）
      ●  低浓度（4%或5%）和高浓度（20%或25%）人血白蛋白溶液都可用于脓 毒症患者液体复苏（Expert opinion）。
      ●   脓毒症患者应用高蛋白结合率抗生素时，建议补充白蛋白，以改善这些药物的药代动力学和药效动力学(Grade 2+, 弱推荐) 。
      ●  推荐出血已控制的失血性休克患者输注人血白蛋白，用于纠正低血容量及低蛋白血症（Grade 2+）。
      ●  ECMO支持期间实施液体复苏的患者，推荐联合使用人血白蛋白和晶体液（Expert opinion）
      2. 一项meta分析纳入21项对照研究的1346例接受体外循环心脏手术的患者，评估不同液体用于泵预充的价值。结果：与晶体液相比，白蛋白用于体外循环泵预充显著改善术中（-3.6 mmHg）和术后（-2.0 mmHg）胶体渗透压的下降，显著改善液体正平衡（-584 mL）及术后体重增加（-1.0 kg）。
