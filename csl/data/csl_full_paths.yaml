  expected:
    source_excel_row: 7
    doctor_type: 低蛋白使用者
    doctor_grade: 提倡
    trans_info: 介绍人血白蛋白用于容量治疗相较于人工胶体的优势。
    support_info: '● 人工胶体存在过敏、干扰凝血功能及肾损伤等副反应，甚至显著升高危重患者的死亡风险，欧美已限制使用

      ▶例如HES，在中国接受HES的脓毒症休克患者死亡率显著升高；EMA于2018年建议禁止HES用于危重症患者，鉴于危重症和脓毒症患者存在肾损伤和死亡风险，建议暂停
      HES 的上市许可

      ● 理想的复苏液体需要兼顾疗效与安全，即可预见性且持久地扩充血管内容量，又能具有近似细胞外液的化学成分，无组织积聚，不导致对代谢/全身不利的影响

      ● 人血白蛋白作为天然胶体，是理想的复苏液体，具有扩充血容量、提高胶体渗透压、纠正血容量不足的功能；且不影响凝血功能，不增加肾损伤风险'
    comm_literature_titles: null
    comm_literature_summaries: null
    focus_title: 人工胶体在临床上使用还可以，是不是只在重症患者中的风险比较高？
    focus_content: '● 无论是否是重症患者，人工胶体的这些安全隐患都始终存在，长期使用更是不利于患者的综合获益。

      ● 《2021 SSC脓毒症与脓毒症休克管理国际指南》1：对成人脓毒症或脓毒性休克患者，不推荐使用羟乙基淀粉进行复苏；对成人脓毒症或脓毒性休克患者，不推荐使用明胶进行复苏

      ●  近年来国际上卫生组织的建议越来越倾向于限制人工胶体的使用，这也反映了他们对人工胶体安全性的担忧。'
    focus_literature_titles: 1. Evans L, et al. Intensive Care Med. 2021;47(11):1181-1247.)
    focus_literature_summaries: 1. 2021 SSC脓毒症与脓毒症休克管理国际指南推荐：对成人脓毒症或脓毒性休克患者，推荐对接受大量晶体液复苏的患者联合使用白蛋白，而非单独使用晶体液。（弱推荐，中等证据质量）
