    focus_content: 现在DRG2.0更多的强调价值医疗，不是简单的考虑治疗费用成本，更是从保证医疗质量与安全的前提下同时通过精细化管理提高效率。现在很多医院绩效考核对于非预期的并发症、院感有很高的控制要求，降低平均住院天数也是绩效考核的一个重要指标。白蛋白虽然单价与使用费用不低，但是纠正低白蛋白血症为患者带来临床上的治疗获益，还能够减少并发症、缩短住院时间、降低再入院率，提高科室病床周转，从而提升科室与医院的绩效考核。
