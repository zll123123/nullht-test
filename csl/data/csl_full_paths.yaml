    trans_info: 介绍应用白蛋白纠正低白蛋白血症可以通过减少并发症发生、缩短住院时间、降低再入院率等方面提高临床治疗获益与效率。
    support_info: |-
      ●对于肝硬化失代偿期患者，人血白蛋白可以减少住院率与住院时间
      ▶研究显示，人血白蛋白联合标准医学治疗，可使失代偿期肝硬化患者全因住院比率下降35%，住院时间下降45%1
      ●ANSWER研究：白蛋白能减少肝硬化并发症及再次住院次数的花费，经济效益更优
      ▶Bootstrap模拟结果显示，长期联合白蛋白治疗提升每位患者每年平均QALY增益0.117，并平均节省495欧元1
    comm_literature_titles: 1. Caraceni P, et al. Lancet, 2018 Jun 16;391 (10138):2417-2429.
    comm_literature_summaries: 1. ANSWER研究是一项多中心随机开放标签研究，纳入431例肝硬化合并无并发症腹水患者，比较标准药物治疗（SMT）与SMT+人血白蛋白（治疗18个月）的效果。结果：白蛋白联合SMT治疗可显著提高18个月生存率（77% vs. 66%，P=0.0285），降低死亡风险38%（HR0.62），降低腹腔穿刺风险52%（HR 0.48），降低顽固型腹水风险57%（HR 0.43），降低SBP风险67%（p<0.001），降低1型肝肾综合征风险61%（p=0.004）；降低全因住院率35%，降低住院天数45%。事后分析：Alb≥40 g/L患者死亡风险降低80%；Alb＜35 g/L患者仍可获益，死亡风险降低57%。经济分析：每位患者每年QALY增益0.117，节省495欧元。
    focus_title: 临床医生认可人血白蛋白的临床优势，但主要还是价格太贵，现在DRG医保控费用是医生和科室绩效考核的主要指标，也有一定的压力。
    focus_content: 现在DRG2.0更多的强调价值医疗，不是简单的考虑治疗费用成本，更是从保证医疗质量与安全的前提下同时通过精细化管理提高效率。现在很多医院绩效考核对于非预期的并发症、院感有很高的控制要求，降低平均住院天数也是绩效考核的一个重要指标。白蛋白虽然单价与使用费用不低，但是纠正低白蛋白血症为患者带来临床上的治疗获益，还能够减少并发症、缩短住院时间、降低再入院率，提高科室病床周转，从而提升科室与医院的绩效考核。
