    support_info: '●中国《人血白蛋白在危重症患者应用专家共识》1推荐人血白蛋白在多种危重症患者中使用，包括腹部外科手术患者、烧伤患者、创伤患者、失血性休克患者、ARDS患者等

      ●低白蛋白血症会影响高蛋白结合率的抗菌药物，可致抗菌治疗失败风险升高，增加患者感染风险

      ▶一项对危重症患者的研究显示，血清白蛋白水平每降低1g/dL，抗菌治疗失败风险升高37%；院内死亡患者的血清白蛋白水平（26g/L）显著低于院内存活患者（
      29g/L ）2

      ●脓毒症患者应用高蛋白结合率抗生素时，建议补充白蛋白，以改善这些药物的药代动力学和药效动力学'
    comm_literature_titles: '1. Yu YT,et al. Chin Med J (Engl).2021;134(14):1639-1654.

      2. Ibrahim, E.H., et al.,Chest, 2000. 118(1):146-155.'
    comm_literature_summaries: '1. 2021 人血白蛋白在危重症患者应用专家共识推荐意见：

      ● 对当脓毒症患者的血清白蛋白水平≥30 g /L，且血流动力学稳定时，可以停止输注白蛋白 (Grade 2+)。

      ● 脓毒症患者应用高蛋白结合率抗生素时，建议补充白蛋白，以改善这些药物的药代动力学和药效动力学(Grade 2+, 弱推荐) 。

      ● 推荐出血已控制的失血性休克患者输注人血白蛋白，用于纠正低血容量及低蛋白血症（Grade 2+）。

      ● 建议烧伤患者血清白蛋白浓度低于30g/L时，补充10%以上高渗人血白蛋白，以纠正低蛋白血症（Experts Opinion）

      ● 急性呼吸窘迫综合症合并低蛋白血症患者，推荐应用人血白蛋白溶液以改善氧合状态（Grade 2+）

      2. 一项前瞻性队列研究纳入492名ICU患者，评估抗菌治疗血流感染的充分性与临床结局关系。结果：院内死亡患者的血清白蛋白水平（2.6 g/dL）显著低于存活者（2.9
      g/dL）；血清白蛋白每下降1 g/dL，抗菌治疗失败风险增加37%（AOR 1.37, p<0.014）。'
    focus_title: 医院管理有严格的规定，限Alb在25g/L以下的患者才能用医保报销白蛋白。
    focus_content: '● 医保报销是医保支付的标准，而不是临床合理用药的标准则，患者的临床治疗需求应该收到保障

      ● 低白蛋白血症与许多疾病结局包括发病率、死亡率和住院时间，以及术后并发症增加密切相关。低白蛋白血症在危重患者中非常常见，是各种临床环境中死亡和其他不良结局的已知风险因素

      ● 白蛋白是低白蛋白血症的唯一特定治疗方法'
