    focus_literature_summaries: 1-2. SAFE研究是一项随机对照研究，纳入澳大利亚和新西兰16家ICU中6997例需容量治疗的患者，分为杰特贝林4%人血白蛋白组（3497例）和生理盐水组（3500例）。亚组分析纳入1218例严重脓毒症患者，最终多变量分析样本为白蛋白组452例，生理盐水组467例，主要评估两种液体复苏对器官功能和死亡率的影响。结果：白蛋白显著降低严重脓毒症患者28天死亡风险29%（p=0.03），对肾功能障碍无显著影响（p=0.92）。白蛋白在复苏早期显著降低净正液平衡，提升中心静脉压，更易促进血流动力学稳定。
