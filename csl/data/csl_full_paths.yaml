    doctor_type: 白蛋白笃信者
    doctor_grade: 尝试
    trans_info: 介绍人血白蛋白相较于晶体液的优势与临床获益。
    support_info: '● 晶体液较难停留在血管内，至少补充3ml晶体液才可替代1ml血液，可引起外周水肿、肺水肿，且具有潜在的呼吸系统不良反应，并缺乏额外的生理特性

      ●  人血白蛋白是天然胶体，除纠正血容量不足的功能外，还可维持内皮细胞糖萼的完整性，改善微循环，具有潜在的器官保护功能

      ● 《2021 SSC脓毒症与脓毒症休克管理国际指南》1建议：对成人脓毒症或脓毒性休克患者，推荐对接受大量晶体液复苏的患者联合使用白蛋白，而非单独使用晶体液。

      ● 研究显示：相比于单纯使用晶体液，联合使用人血白蛋白能够改善严重脓毒症患者血流动力学，且并不增加肾功能风险2-3；相比晶体液，人血白蛋白显著降低脓毒症休克患者90天死亡风险达19%4'
    comm_literature_titles: '1. Evans L, et al. Intensive Care Med. 2021;47(11):1181-1247.)

      2. Finfer S,et al. N Engl J Med. 2004;350(22):2247-2256；

      3. SAFE Study Investigators, Intensive Care Med. 2011 Jan;37 (1):86-96

      4. Xu JY, et al. Crit Care,2014, 18(6): 702'
    comm_literature_summaries: '1. 2021 SSC脓毒症与脓毒症休克管理国际指南推荐：对成人脓毒症或脓毒性休克患者，推荐对接受大量晶体液复苏的患者联合使用白蛋白，而非单独使用晶体液。（弱推荐，中等证据质量）

      2-3. SAFE研究是一项随机对照研究，纳入澳大利亚和新西兰16家ICU中6997例需容量治疗的患者，分为杰特贝林4%人血白蛋白组（3497例）和生理盐水组（3500例）。亚组分析纳入1218例严重脓毒症患者，最终多变量分析样本为白蛋白组452例，生理盐水组467例，主要评估两种液体复苏对器官功能和死亡率的影响。结果：白蛋白显著降低严重脓毒症患者28天死亡风险29%（p=0.03），对肾功能障碍无显著影响（p=0.92）。白蛋白在复苏早期显著降低净正液平衡，提升中心静脉压，更易促进血流动力学稳定。

      4. 一项荟萃分析评估了白蛋白与晶体液对严重脓毒症和脓毒症休克患者液体复苏的效果，共纳入5项研究，涉及3658例严重脓毒症和2180例脓毒症休克患者。
      结果：白蛋白相比晶体液显著降低脓毒症休克患者90天死亡风险19%（RR=0.81）。'
    focus_title: 医院对于人血白蛋白的处方是有明确规定的，Alb＜30 g/L的患者如果需要液体复苏或容量治疗，临床医生会使用晶体液和白蛋白联合治疗。如果Alb≥30
      g/L，临床医生使用时会被限制。
    focus_content: ● 血清白蛋白浓度的水平，并非决定是否使用白蛋白的唯一因素，其用于纠正血容量不足的作用与白蛋白水平无关；对肝病患者而言，维持有效血容量、增加利尿剂应答的作用与白蛋白治疗前的血清浓度关系不大，因此同样无需根据血清浓度决定是否使用白蛋白。使用人血白蛋白进行容量治疗可降低相关患者的并发症和死亡率。
