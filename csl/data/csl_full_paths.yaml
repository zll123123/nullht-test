    comm_literature_summaries: null
    focus_title: 有临床研究数据能证明杰特贝林白蛋白的安全性吗?
    focus_content: '● SAFE研究是一项随机对照研究，纳入了澳大利亚和新西兰16家医院ICU中需要容量治疗的患者

      ● 6997例，分为白蛋白组（n=3497，使用杰特贝林4%人血白蛋白）和生理盐水组（n=3500）。该研究采

      ● 用的人血白蛋白为杰特贝林产品，针对入选的1218例严重脓毒症患者进行了亚组分析。结果显示，相比生理盐水，杰特贝林人血白蛋白组未显著增加严重脓毒症患者肾功能障碍风险（p=0.9206）1,2'
    focus_literature_titles: '1. Finfer S,et al. N Engl J Med. 2004;350(22):2247-2256；

      2. SAFE Study Investigators, Intensive Care Med. 2011 Jan;37 (1):86-96'
    focus_literature_summaries: 1-2. SAFE研究是一项随机对照研究，纳入澳大利亚和新西兰16家ICU中6997例需容量治疗的患者，分为杰特贝林4%人血白蛋白组（3497例）和生理盐水组（3500例）。亚组分析纳入1218例严重脓毒症患者，最终多变量分析样本为白蛋白组452例，生理盐水组467例，主要评估两种液体复苏对器官功能和死亡率的影响。结果：白蛋白显著降低严重脓毒症患者28天死亡风险29%（p=0.03），对肾功能障碍无显著影响（p=0.92）。白蛋白在复苏早期显著降低净正液平衡，提升中心静脉压，更易促进血流动力学稳定。
